# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: n = 1.251 yêu cầu mỗi nhóm (z chính xác 1,95996 và 0,84162).
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48 → 1.251 × 2,48 = 3.103 yêu cầu mỗi nhóm
#      = 42 nhân viên mỗi nhóm, tổng 84 > 40 nhân viên CSKH: KHÔNG ĐỦ NGƯỜI.
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng < c ÷ ICC = 20 ÷ 0,02 = 1.000 < 1.251: KHÔNG ĐẠT, dù m lớn đến đâu.
#   d) 6 depot mỗi nhóm: hiệu dụng < 6 ÷ 0,02 = 300; chỉ 6 cụm (< 20): LOẠI.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: 20m ÷ (1 + (m − 1) × 0,02) ≥ 859
#      → 2,82m ≥ 841,82 → m ≥ 299 yêu cầu mỗi nhân viên (DE = 6,96; hiệu dụng 859,2).
#   Con số bất lợi: thiết kế đủ mẫu cho 6 điểm; nếu tác động thật chỉ 5 điểm thì power còn 0,64 (n = 859).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: có, 20 nhân viên đối chứng làm cùng tuần, cùng depot, cùng phạm vi loại yêu cầu.
#   2. Chia ngẫu nhiên hay do người chọn: ngẫu nhiên, bốc thăm bằng code với seed ghi trước, phân tầng theo depot (12 depot).
#   3. Ảnh hưởng gián tiếp và cách giảm: nhân viên cùng depot có thể chia sẻ câu trả lời của trợ lý; giảm bằng quyền
#      truy cập theo tài khoản, log mọi lượt mở trợ lý theo staff_id, và báo tỉ lệ nhóm đối chứng mở trợ lý (mục tiêu 0%).
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: có, chốt trong file này trước ngày bắt đầu 2026-12-07.
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Chia theo yêu cầu đủ mẫu (1.251) nhưng cùng một nhân viên vừa dùng vừa không dùng trợ lý → tràn tác động, kết quả
#   khó tin. Chia theo depot chỉ có 6 cụm. Nhóm chọn chia theo nhân viên 20 + 20 và nâng mức chênh tối thiểu từ 5 lên
#   6 điểm (n = 859/nhóm, m ≥ 299 yêu cầu/nhân viên). Chấp nhận power 0,64 nếu tác động thật chỉ 5 điểm;
#   Giám đốc vận hành ký chấp nhận trước ngày bắt đầu.
#   Đủ m ≥ 299: 1.500 yc/ngày ÷ 40 nhân viên × 81,8% thuộc phạm vi (982/1.200) ≈ 30,7 yc/nhân viên/ngày
#   → bước 0.50 kéo dài 14 ngày ≈ 430 yc/nhân viên ≥ 299.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Toàn mẫu 4,25% (51/1.200); phạm vi noi_dia + hang_nang 3,97% (39/982); riêng noi_dia 3,16%, hang_nang 8,23%.
#   Không dùng ngưỡng tuyệt đối 3% (pilot sẽ dừng ngay tuần đầu). Ngưỡng: nhóm trợ lý cao hơn đối chứng ≥ 2 điểm,
#   hoặc vượt trần tuyệt đối 6% cho cả phạm vi. hang_nang đã ở 8,23% trong đợt chạy thử nên chỉ so với đối chứng
#   cùng loại (≥ 2 điểm), không dùng trần 6% cho riêng loại này.
#
# Thay đổi thiết kế sau phản biện hội đồng Gate 2a (2026-11-21, trước ngày bắt đầu, chưa có dữ liệu pilot):
#   Luật chi phí 9.600 đ chỉ áp từ bước 0.50. Lý do: bước 0.10 và 0.25 vẫn xem lại 100%, chi phí đã biết trước là
#   (10.568.513 + 82 × 12.000) ÷ 982 = 11.764 đ/yêu cầu = 0,98× [simulated] > 9.600 đ. Bản cũ vì vậy chắc chắn kích
#   cuối tuần 2 (2026-12-20), trước mốc giảm xem lại 2026-12-21: luật đo một điều đã biết, không phải tín hiệu mới.
#   Giữ nguyên ngưỡng 9.600 đ, thời hạn 2 tuần, hành động và người phụ trách. Luật an toàn, luật sổ cái và luật mức
#   độ dùng vẫn áp từ ngày đầu. Giám đốc vận hành duyệt thay đổi này cùng lúc ký chấp nhận mức chênh 6 điểm
#   (kiểm tra 2026-12-04).

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: >-
    Chỉ yêu cầu noi_dia và hang_nang, 40 nhân viên CSKH ở cả 12 depot. Lý do theo A3 (simulated):
    noi_dia 0,22× và hang_nang 0,69× so với 12.000 đ; cả hệ thống trong phạm vi 4.131 đ/yêu cầu = 0,34×.
    Loại quoc_te (1,88×, 27,3% thành công, chạy lại lần 3 chỉ ok 2,2%) và doi_tac
    (cả hệ thống 0,92×, 54,4% thành công, điều khoản riêng).
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
    method: "Bốc thăm 20/40 nhân viên bằng code, seed ghi trước, phân tầng theo depot"
  rollout: [0.10, 0.25, 0.50]     # 4 → 10 → 20 nhân viên dùng trợ lý; 0.10 và 0.25 mỗi bước 1 tuần, 0.50 kéo dài 2 tuần
  rollout_schedule:
    step_010: "2026-12-07 đến 2026-12-13"
    step_025: "2026-12-14 đến 2026-12-20"
    step_050: "2026-12-21 đến 2027-01-03, chỉ đo chỉ số chính trong bước này"
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận: 20 cụm mỗi nhóm không đủ cho 5 điểm (tối đa 1.000 < 1.251)
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
    requests_per_cluster_min: 299
    power_if_true_effect_5pt: 0.64
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng thời gian, cùng depot, cùng phạm vi noi_dia + hang_nang"
    spillover_risk: >-
      Trung bình: nhân viên cùng depot có thể chia sẻ câu trả lời. Giảm bằng quyền truy cập theo tài khoản và log
      lượt mở trợ lý theo staff_id; nếu > 5% yêu cầu của nhóm đối chứng có lượt mở trợ lý thì ghi là vi phạm thiết kế.
    predeclared: >-
      Có: chỉ số chính, mde 0,06, alpha, các luật dừng và ngày quyết định 2027-01-12 chốt trong file này
      trước ngày bắt đầu 2026-12-07; không đổi sau khi đã xem dữ liệu.
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng ≥ 2 điểm (tính chung hoặc riêng hang_nang), hoặc vượt 6% cho cả phạm vi TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và chuyển toàn bộ về nhân viên tự làm KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU có từ 1 ca hoàn tiền trùng hoặc sai số tiền phát hiện qua đối soát sổ cái TRONG bất kỳ ngày nào THÌ Kế toán trưởng khoá ghi sổ tự động trong 1 giờ, PM trợ lý hoàn phí rà trace_id trong 24 giờ KHÔNG THÌ không được bật lại ghi sổ tự động"
    - "NẾU chi phí biến đổi cả hệ thống mỗi yêu cầu của nhóm trợ lý (token + tool + phút xem lại, làm lại đo thật + 12.000 đ cho mỗi ca không thành công) > 9.600 đ = 0,8× của 12.000 đ TRONG 2 tuần liên tiếp tính từ bước 0.50 (2026-12-21 đến 2026-12-27 và 2026-12-28 đến 2027-01-03; ở bước 0.10 và 0.25 chỉ ghi số hằng tuần, không áp luật này) THÌ PM trợ lý hoàn phí giảm xem lại theo bậc, thu hẹp về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở rộng sang loại yêu cầu khác"
    - "NẾU tỉ lệ bỏ qua gợi ý (sửa + bỏ trên số được xem lại) > 40% (đợt chạy thử 21,1% trong phạm vi) TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên nhóm trợ lý trong 3 ngày KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt trợ lý, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm như hiện tại (6 phút/yêu cầu)"
  decision_date: "2027-01-12"     # yêu cầu cuối của bước 0.50 (2027-01-03) cần đủ 7 ngày để biết có mở lại hay không
  simulated_inputs:
    - "phut_xem_lai_simulated, phut_lam_lai_simulated (logix_requests.csv)"
    - "Chi phí mỗi việc thành công 4.472 đ toàn mẫu; 3.414 đ trong phạm vi; 4.599 đ khi cộng cố định 40 triệu đ/tháng"
    - "Cả hệ thống trong phạm vi 4.131 đ/yêu cầu = 0,34× của 12.000 đ; theo loại 0,26× noi_dia, 0,77× hang_nang"
    - "Ngưỡng dừng chi phí 9.600 đ/yêu cầu: chừa 2.370 đ/việc chi phí cố định khi khối lượng còn một nửa (A4), tổng ≈ 12.000 đ"
    - "B4 xem lại 100%: 11.743 đ = 0,98× (12.415 đ = 1,03× nếu làm lại 15,3 phút/ca)"
    - "Toàn bộ dữ liệu logix_runs.csv, logix_requests.csv là giả lập của lab"
